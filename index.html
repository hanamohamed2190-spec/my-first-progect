 <!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>

    <style>
        body {
            background-color: #f3e8ff;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 100px;
        }

        .card {
            background-color: white;
            width: 70%;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            color: #7b2cbf;
            font-size: 40px;
        }

        p {
            color: #444;
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            background-color: #7b2cbf;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #5a189a;
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Hello! 👋 Welcome to my first website! 💻✨</h1>

        <p>
            I'm learning programming and building my skills step by step. 🚀
        </p>

        <button onclick="alert('Welcome to my website! ❤️')">
            Click Me!
        </button>

    </div>

</body>
</html>
